name: Post Benchmark Comment
on:
  workflow_run:
    workflows: ["Benchmarks"]
    types: [completed]
jobs:
  comment:
    name: post benchmark comment
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    permissions:
      pull-requests: write
      actions: read
    steps:
      - name: Download benchmark results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Post comment to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const run = context.payload.workflow_run;
            const prs = run.pull_requests || [];
            if (prs.length !== 1) {
              core.info('Skipping benchmark comment: no unique PR associated with this run.');
              return;
            }
            const prNumberText = fs.readFileSync('pr_number.txt', 'utf8').trim();
            if (!/^[1-9][0-9]*$/.test(prNumberText)) {
              throw new Error('Invalid benchmark PR number');
            }
            const prNumber = Number(prNumberText);
            if (!Number.isSafeInteger(prNumber) || prNumber !== prs[0].number) {
              throw new Error('Benchmark artifact does not belong to this run PR');
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            if (pr.state !== 'open' || pr.head.sha !== run.head_sha ||
                pr.head.repo?.id !== run.head_repository?.id) {
              core.info('Skipping stale benchmark results.');
              return;
            }
            if (fs.statSync('benchmark_result.txt').size > 50000) {
              throw new Error('Benchmark result exceeds comment limit');
            }
            const benchResult = fs.readFileSync('benchmark_result.txt', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `## Benchmark Results\n<pre>${benchResult.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</pre>`
            });
